name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run host test suite
        run: make test

  format:
    name: C formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18 clang-tidy-18
      - name: Check C formatting
        run: make CLANG_FORMAT=clang-format-18 format-check
      - name: Run clang-tidy
        run: make CLANG_TIDY=clang-tidy-18 tidy
