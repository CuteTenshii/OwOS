name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  iso:
    name: Build ISOs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools

      - name: Build 32-bit ISO
        run: |
          make iso
          mv owos.iso owos-i386.iso

      - name: Build 64-bit ISO
        run: |
          make clean
          make ARCH=x86_64 iso
          mv owos.iso owos-x86_64.iso

      - name: Upload ISOs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" owos-i386.iso owos-x86_64.iso --clobber
